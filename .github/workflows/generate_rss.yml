name: Generate RSS Links & Bundle

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4

      - name: Run Feed Links & Bundle Generator
        run: python rss_engine.py --generate

      - name: Commit and Push Updated Excel and Feeds
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add GDT_RSS_Feed_Gen.xlsx feeds/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated RSS Links and initial feeds" && git push)
